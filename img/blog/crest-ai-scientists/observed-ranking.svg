<svg xmlns="http://www.w3.org/2000/svg" width="640" height="612" viewBox="0 0 640 612" role="img" aria-labelledby="ranking-title ranking-desc">
<title id="ranking-title">Observed paper preferences across five AI scientists</title>
<desc id="ranking-desc">Measured results from 96 paper pairs and 384 judgments. Each pair has four votes from two judges in both paper orders. Overall percentages average the four opponent matchup rates equally. Sakana Agentic Scientist v3: 96.9 percent, 2 selected of 2 eligible papers. ScientistTwo: 73.8 percent, 29 of 86. ScientistOne: 53.8 percent, 17 of 21. Sakana AI Scientist v2: 22.5 percent, 3 of 3. Sakana AI Scientist v1: 3.1 percent, 35 of 298. Points show observed percentages, without sampling ranges. The accompanying post explains the exploratory uncertainty.</desc>
