<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-label="Outer evolutionary loop wrapping an inner gradient-descent loop.">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <style>
      .lbl { font-family: 'Inter', system-ui, sans-serif; }
      .title { font-family: 'Lora', Georgia, serif; }
    </style>
  </defs>
  <rect x="1" y="1" width="718" height="338" rx="14" fill="#ffffff" stroke="#e5e7eb"/>

  <!-- Outer loop: evolution -->
  <rect x="28" y="30" width="664" height="280" rx="12" fill="none" stroke="url(#accent)" stroke-width="2.5" stroke-dasharray="7 7"/>
  <text x="48" y="56" class="title" font-size="17" fill="#1e3a8a" font-weight="600">Outer loop &#183; evolutionary search</text>

  <!-- Inner loop: gradient descent -->
  <rect x="210" y="118" width="300" height="120" rx="10" fill="#eef2ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="360" y="150" text-anchor="middle" class="title" font-size="15" fill="#111827" font-weight="600">Inner loop</text>
  <text x="360" y="176" text-anchor="middle" class="lbl" font-size="13" fill="#374151">gradient descent</text>
  <text x="360" y="198" text-anchor="middle" class="lbl" font-size="13" fill="#374151">trains each network</text>

  <!-- Population nodes -->
  <circle cx="90" cy="175" r="20" fill="url(#accent)"/>
  <circle cx="150" cy="120" r="14" fill="#7c3aed" opacity="0.8"/>
  <circle cx="150" cy="230" r="14" fill="#1d4ed8" opacity="0.8"/>
  <circle cx="630" cy="175" r="20" fill="url(#accent)"/>
  <circle cx="570" cy="120" r="14" fill="#1d4ed8" opacity="0.8"/>
  <circle cx="570" cy="230" r="14" fill="#7c3aed" opacity="0.8"/>

  <!-- Arrows -->
  <g stroke="#6b7280" stroke-width="1.8" fill="none" marker-end="url(#arrow)">
    <path d="M116 175 H206"/>
    <path d="M514 175 H604"/>
  </g>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/>
    </marker>
  </defs>
  <text x="160" y="300" class="lbl" font-size="12" fill="#6b7280">mutate &amp; recombine architectures</text>
  <text x="452" y="300" text-anchor="end" class="lbl" font-size="12" fill="#6b7280">select by fitness</text>
</svg>
