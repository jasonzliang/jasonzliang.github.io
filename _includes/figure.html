{%- comment -%}
Captioned, responsive image.
Usage:  {% include figure.html src="/img/blog/my-post/diagram.svg" alt="..." caption="..." %}
{%- endcomment -%}
<figure class="post-figure">
  <img src="{{ include.src | relative_url }}" alt="{{ include.alt | default: include.caption | default: '' }}" loading="lazy" />
  {%- if include.caption %}<figcaption>{{ include.caption }}</figcaption>{%- endif %}
</figure>
